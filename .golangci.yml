# golangci-lint configuration.
# Keep this thin — prefer gofmt/go vet defaults over a large rule farm.

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    govet:
      enable:
        - shadow

formatters:
  enable:
    - gofumpt
